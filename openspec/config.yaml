  write_path: staged         # remember / list_staged / discard_staged write to staging; recall mixes source:"staged"
  promote_path: local        # POST /promote (dev stubs) applies staged items to memory end-to-end; real Bedrock/OIDC/API-Gateway deferred
  package_manager: pnpm-ONLY # packageManager pin + engine-strict + guard-package-manager hook
  archived_changes:
    - scaffold-runtime-mcp-facade   # Express + MCP facade + Vitest
    - auth-two-gate                 # Cognito Gate 1 + RDS Gate 2/RBAC + audit + migration 0001
    - data-model                    # memory read tables 0002 + MemoryRepository; read tools serve real data
    - dev-harness                   # Docker + compose + seed + dev-only Cognito bypass (4-barrier prod guard)
    - write-path                    # staging tables 0003 + StagingRepository + remember/list_staged/discard_staged + RBAC write-roles + audit + recall staging-mix
    - promotion-schema-gaps         # migration 0004: promoted_at/promoted_memory_id (FK SET NULL) + partially_promoted status + sweep-safe quarantine table (schema-only groundwork)
    - promotion-pipeline            # POST /promote + injectable OIDC/Judge stubs + apply to memory (4 ops, idempotent) + quarantine + terminal state; real Bedrock/OIDC/API-Gateway deferred
    - hybrid-search                 # migration 0005 (pgvector + embedding vector(1024) + HNSW); two-phase recall (BM25 → semantic fallback when <N); Embedder seam (stub now, Bedrock Titan v2 deferred)
    - real-bedrock-clients          # real Titan v2 embedder (InvokeModel) + Claude Haiku judge (Converse) behind BedrockInvoker seam; +@aws-sdk/client-bedrock-runtime; AWS_REGION/timeout/retry config; fail-closed/fail-soft strengthened (word-boundary verdict, XML-delimited untrusted fields). 442 tests
