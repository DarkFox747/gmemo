# SDD (Spec-Driven Development) configuration
# Generated by sdd-init. Canonical, committable project context.
schema: sdd-config-v1

project:
  name: gmemo
  display_name: gmemo — Shared Memory Service
  description: >-
    Crombie-internal shared memory service for AI agents (Claude Code, Cowork,
    Atenea). Evolves the local SQLite LPMS into a centralized AWS/RDS Postgres
    service with a single MCP facade. Two-layer memory (governed decision memory
    in RDS + derived code graph), single write path (agents stage only; promotion
    via PR merge or human Web UI action).
  stage: demo-e4-complete   # C0–C8 archived on branch demo/e4: governed memory (judge, review queue, quarantine, lifecycle, direct management), RRF search, governance web, demo kit (updated 2026-11-08)
  primary_language: TypeScript (Node.js, ESM)   # pilot runtime: Express

stack:
  runtime:
    pilot: Node.js + Express on EC2
    production: same Docker image on ECS/Fargate
  database:
    engine: PostgreSQL 16 (AWS RDS, Multi-AZ)
    extensions: [pgcrypto]
    planned_extensions: [pgvector]     # semantic search, deferred
    schema_version: v2                 # docs/artefactos/gmemo_schema_v2.sql
  protocol: MCP (Model Context Protocol) facade
  auth:
    identity_provider: AWS Cognito (federated to Google Workspace, @<COMPANY_DOMAIN> allowlist)
    ci_identity: GitHub Actions OIDC (ephemeral IAM role)
    model: two-gate (valid Cognito JWT + provisioned/enabled app_user in RDS)
  cloud:
    provider: AWS
    services: [Cognito, Bedrock, ALB, API Gateway, Fargate, EC2, RDS, S3, WAF, Route53, ACM, Secrets Manager, ECR, PrivateLink]
    edge: ALB (MCP/SSE) + API Gateway (web API + /promote)
    llm: AWS Bedrock (staging judge)
  ci_cd: GitHub Actions + OIDC (build -> ECR -> deploy); 3 webhooks (PR opened, PR merged, branch deleted)

testing:
  framework: vitest          # 442 tests passing (89 DB-gated integration skipped without DATABASE_URL)
  tdd_mode: enabled
  runner: "pnpm test -- --run"
  note: >-
    Unit + handler tests run with no external services (in-memory repository fakes +
    injectable Cognito verifier). DB integration tests (tests/db/*.integration.test.ts)
    skip unless DATABASE_URL is set.

