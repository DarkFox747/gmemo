conventions:
  language_rule: All memories stored in English regardless of conversation language.
  ids: UUID for most tables (pgcrypto); ULID for staging_session (time-sortable).
  budgets_as_db_checks: Content length limits enforced as DB CHECK constraints, not app logic.
  error_opacity: No tenant/resource enumeration in errors (OWASP-aligned); generic denials only.
  tenancy_unit: project is the unit of both access control and memory partitioning.
  fts_weighting: title=A, summary=B, body=C in tsvector.
  shared_rbac_lib: single shared RBAC library across both auth paths (Cognito + IAM/OIDC).

persistence:
  primary_store: openspec/          # canonical, committable
  cache_store: lpms                 # optional MCP cross-session cache (best-effort)

