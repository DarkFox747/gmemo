# Project Map — pre-built atlas for all SDD phases.
# Generated by sdd-init; kept in sync as changes land. Runtime code EXISTS (see the
# implemented modules below). Every SDD sub-agent reads this BEFORE working to avoid re-exploring.
schema: project-map-v1

project: gmemo
stage: pilot-memory-loop-closed-locally   # 7 changes archived (…+ promotion-schema-gaps + promotion-pipeline); read + propose-to-staging + local promote-to-memory all working
summary: >-
  Two-layer shared-memory service exposed through a single MCP facade. Layer 1
  (governed decision memory) in RDS Postgres; Layer 2 (derived code graph) built
  by repo CI. Agents READ and PROPOSE only — remember() always writes to staging;
  promotion to main happens exclusively via PR merge or human Web UI action.

# --- Tooling (ENFORCED) ---
tooling:
  package_manager: pnpm            # ONLY. Pinned via package.json packageManager: pnpm@9.15.0
  forbidden: [npm, bun, yarn]      # blocked by engines + .npmrc engine-strict + guard-package-manager hook
  install_for_agents: "pnpm install --frozen-lockfile"   # the ONLY install agents may run
  add_deps: "humans run `pnpm add …` out-of-band, commit pnpm-lock.yaml, agents reproduce frozen"
  lockfile: pnpm-lock.yaml         # single source of truth (no package-lock.json / bun.lock)

# --- Module boundaries (INTENDED — no code exists yet) ---
modules:
  facade-mcp:
    purpose: Single MCP entry point for all agents; resolves tenant from token + git remote.
    read_tools: [recall, get_memory, get_context]
    stage_tools: [remember, list_staged, discard_staged]
    graph_tools: [trace_call_path, get_architecture, search_graph]
    not_exposed_to_agents: [save, update, delete, promote]
    rbac: viewer+ for reads; contributor/service_agent for writes; per-request vs project_membership
    design_ref: docs/artefactos/gmemo_facade_contract_v1.md
  memory-layer1:
    purpose: Authoritative governed decision memory (7 typed records).
    types: [decision, constraint, gotcha, pattern, integration_note, domain_rule, outcome]
    store: RDS PostgreSQL 16
    search: hybrid BM25 (tsvector+GIN, implemented) + pgvector (planned) via RRF + time-decay
    design_ref: docs/05-tipos-memoria-y-busqueda.md
  staging-promotion:
    purpose: Write buffer + promotion pipeline (secret-scan -> sanitize -> judge -> idempotent apply).
    session_key: (project, repo, branch); lazy-created; 7d sliding TTL; pinned to open PRs
    judge_states: [accepted (auto), rejected (quarantine+alert), uncertain (human queue)]
    fail_mode: fail-closed (LLM down => uncertain, never accepted)
    operations: [add, amend, supersede, deprecate]
    design_ref: docs/04-escritura-staging-promocion.md
  graph-layer2:
    purpose: Structural code graph, reproducible; built on repo's OWN CI runners.
    flow: CI runs indexer -> S3 presigned upload -> notify backend (OIDC, repo-scoped)
    status: design-light (cross-link Layer1<->Layer2 deferred)
    design_ref: docs/08-onboarding-y-operacion.md
  auth-rbac:
    purpose: Two-gate auth + fine-grained RBAC.
    gate1: Cognito JWT (JWKS, iss, token_use=access, exp, client_id/scope; NOT aud)
    gate2: sub maps to provisioned + enabled app_user in RDS
    roles: [Platform Owner, Platform Admin, Project Admin, Contributor, Viewer, Service/Agent]
    membership_store: RDS authz table (NOT Cognito groups)
    identity_flows: [OAuth2.1+PKCE (interactive dev), client_credentials (headless agents), OIDC (CI/ingest, /promote)]
    design_ref: docs/03-auth-identidad-rbac.md
  infra:
    purpose: AWS topology — single-AZ pilot delivered (change terraform-infra).
    pilot_topology:
      roots: [terraform/bootstrap (local state → S3+DynamoDB), terraform/envs/pilot (S3 backend)]
      modules: [network, data, cognito, dns-tls, service]
      network: single-AZ cost posture; 2 public + 2 private subnets/2 AZs (ALB+RDS subnet group require ≥2); IGW; NO NAT; NO VPC endpoints
      compute: Fargate task in public subnet (assign_public_ip=true, SG locked to ALB SG); ECR; ECS cluster
      data: RDS db.t4g.micro pg16 gp3 20GB encrypted single-AZ private; rds.force_ssl=1 parameter group; random_password→DATABASE_URL→Secrets Manager
      auth_gate1: real Cognito user pool (admin-create-only, email sign-in, USER_PASSWORD_AUTH, 15-min TTL, no hosted UI/federation/groups); authorized_user_emails for_each (SUPPRESS, no password in state)
      tls: ACM cert us-east-1 DNS-validated; Route53 ALIAS A/AAAA → ALB; ALB :443 HTTPS (ELBSecurityPolicy-TLS13-1-2-2021-06) + :80→301 redirect; no CloudFront/wildcard
      iam: execution role (ECR+Logs+SecretValue scoped); task role (bedrock:InvokeModel+Converse on model ARNs var, least-privilege)
      rds_tls_trust: RDS global CA bundle baked into image; NODE_EXTRA_CA_CERTS=/etc/ssl/certs/rds-global-bundle.pem
      mode: NODE_ENV=production; all bypass/stub flags=false; real Bedrock; real GitHub-OIDC /promote LIVE (change promote-oidc) — operator sets GITHUB_OIDC_AUDIENCE + machine_credential
      cost_approx: ~$46/mo (ALB+Fargate+RDS+IPv4+SM+optional Route53 zone)
    deferred_to_hardening: [NAT review, Web UI uncertain queue, quarantine sweep, WAF/CloudFront, rate-limit /promote (M-02)]   # real GitHub-OIDC /promote DONE (change promote-oidc)
    design_ref: openspec/changes/terraform-infra/design.md

# --- Data model (schema v2 — validated) ---
data_model:
  source: docs/artefactos/gmemo_schema_v2.sql
  tenancy: [app_user, project, repo (remote_url = natural key), project_membership, machine_credential]
  memory:
    memory: authoritative record; tsvector GIN; fields jsonb; status enum (active|superseded|deprecated|pending_revalidation); content_hash; ttl_days; origin_branch/pr; revalidate_at (NULL for outcome); retired_reason (3..500 CHECK)
    enums_added_c4: "0009: memory_status += pending_revalidation; provenance += web_ui (written by C5)"
    memory_revision: immutable audit trail; UNIQUE(memory_id, revision_no)
    memory_relation: typed edges (supersedes, conflicts_with, duplicate); source = judge|human
  staging:
    staging_session: ULID PK; partial unique index = one open session per (project, repo, branch)
    staging_item: op, judge_state, sanitize_flags, content_hash; CHECK add<->target_memory_id
  audit:
    access_log: every read (query_hash, not raw text) + every write
  known_gaps_for_prod:   #      # ALL CLOSED
    - "CLOSED (0004): staging_item.promoted_at / promoted_memory_id (idempotent promotion)"
    - "CLOSED (0004): partially_promoted status"
    - "CLOSED (0004): quarantine table (self-contained, sweep-safe)"
    - "CLOSED (0002): FTS dictionary 'english'"

# --- Conventions (HOW to write code that fits) ---
conventions:
  language: All memory content in English (skill-enforced, not server-side).
  ids: UUID (pgcrypto) default; ULID for time-sortable staging_session.
  budgets: title<=120, summary<=200, body<=2000 — enforced as DB CHECK constraints.
  handles: opaque handle = (memory_id, revision); stale refs marked 'uncertain'.
  errors: no tenant/resource enumeration; generic denials (OWASP-aligned).
  rbac: single shared RBAC lib across Cognito + IAM/OIDC paths (avoid split-brain).
  fts: tsvector weights title=A summary=B body=C.

# --- Tests (WHERE and HOW) ---
tests:
  framework: vitest
  status: configured (scaffolded by change scaffold-runtime-mcp-facade)
  tdd_mode: enabled
  location: tests/ (mirrors src/; tests/mcp/* for facade tools)
  patterns: supertest for HTTP; SDK InMemoryTransport + Client for MCP tool registration; direct handler calls for stub shape assertions.
  run: "npm run build && npm test -- --run && npm run lint"

