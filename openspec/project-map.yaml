project: gmemo
stage: demo-e4-complete   # C0–C13 archived on demo/e4; full governed loop runs locally (docker compose)
summary: >-
  Shared, governed memory for software-development agents, exposed through one MCP
  facade (POST /mcp). Agents READ (recall, get_memory, get_context) and PROPOSE
  (remember → per-branch staging). Knowledge reaches project memory only through PR
  merge (POST /promote: sanitize → judge → route apply | review queue | quarantine) or
  a human action of the tech lead in the governance web (/api/v1 + packages/web).
  Layer 2 (code graph) is design-only.

# --- Tooling (ENFORCED) ---
tooling:
  package_manager: pnpm            # ONLY. packageManager pnpm@9.15.0; engines node>=22, pnpm>=9
  forbidden: [npm, bun, yarn]      # engines + .npmrc engine-strict + guard-package-manager hook
  install_for_agents: "pnpm install --frozen-lockfile"
  add_deps: "humans run `pnpm add …` out-of-band and commit pnpm-lock.yaml; agents never add deps"
  lockfile: pnpm-lock.yaml         # lockfileVersion 9.0
  workspace: pnpm-workspace.yaml (packages/*) — server at repo root, web at packages/web (@gmemo/web)
  npmrc: "engine-strict=true; minimum-release-age=10080 is INERT until pnpm>=10.16"
  local_stack: "docker compose up --build -d --wait → db pgvector/pgvector:pg16 (127.0.0.1:5433), migrate (migrations + seed.dev.sql), app (127.0.0.1:3000, NODE_ENV=development, all stubs/bypasses on, web served via WEB_STATIC_DIR)"
  container: "Dockerfile multi-stage node:22-alpine (deps, builder, web-builder, runtime); USER node; CMD node dist/index.js"

