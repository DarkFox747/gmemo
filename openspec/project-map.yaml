  deferred:
    - Server-side verification of the merged PR against the GitHub API (trust boundary = promote.yml on push to default branch).
    - closed_unmerged event/workflow binding (pre-existing; limited to the PR's own head branch).
    - Cognito PKCE login for the web (demo uses X-Dev-User); SES notifications (logNotifier); SQS/EventBridge (in-process + /internal/jobs).
    - Layer 2 code graph (graph tools advertised in the contract, not implemented); cross-link Layer1↔Layer2.
    - "Facade contract v1 RBAC table omits project_admin for write tools (code admits it); contract does not cover /api/v1, /promote, jobs."
    - deploy.yml not gated on ci.yml; Dockerfile RDS CA bundle fetched without hash pin.
  follow_ups: openspec/backlog.md (Entrega 4 section)
