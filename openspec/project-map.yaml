# --- Testing ---
testing:
  framework: vitest
  tdd_mode: enabled
  command: "pnpm test -- --run"          # unit only (DB suites skip without DATABASE_URL)
  db_command: "DATABASE_URL=postgres://gmemo:gmemo@localhost:5433/gmemo pnpm test -- --run"
  full_check: "pnpm lint && pnpm build && pnpm typecheck:web && <db_command>"
  config_files: [vitest.config.ts, tests/globalSetup.ts]
  layout: >-
    tests/<domain>/*.test.ts mirrors src/ (unit; supertest for HTTP; SDK InMemoryTransport for MCP);
    tests/db/*.integration.test.ts gated by `DATABASE_URL ? describe : describe.skip`;
    fakes in tests/<domain>/fakes.ts; web tests in packages/web/src/**/*.test.ts (root config).
  db_warning: >-
    tests/globalSetup.ts DROPS schema public of the DATABASE_URL db (guarded: local host + db 'gmemo')
    → after a DB run, rebuild the demo: docker compose down -v && docker compose up --build -d --wait.
  e2e: "pnpm smoke (20 steps) and pnpm demo (E2E script) against the running compose stack; pnpm eval writes docs/demo/metricas.md"
  counts_at_generated_commit: {total: 2297, unit: 1963, db: 334}
  coverage: {tool: null, threshold: null}
  ci: .github/workflows/ci.yml runs `pnpm exec vitest run` with a pgvector service
  area_context: null   # wrong node:test/npm tests area removed 2026-11-08; conventions above are authoritative

# --- Conventions ---
conventions:
  commit_style: "Conventional Commits with scope, lowercase subject (feat(promote): …, fix(demo): …, docs(demo): …)"
  branch_naming: "demo/e4 (work branch), feature/<topic>; staging sessions keyed by branch; reserved restore/ and web/ prefixes"
  code_style: "ESLint 9 flat (js + typescript-eslint recommended + prettier; web bans innerHTML/dangerouslySetInnerHTML/eval); Prettier semi, singleQuote, trailingComma all, printWidth 100; LF (.gitattributes)"
  documentation: "Module header doc comments stating contract + invariants; Spanish user docs in docs/demo; English code/comments/memory content; web UI Spanish via labels.ts"
  naming: "backend files lowerCamelCase.ts; repositories <thing>Repository.ts with Pg* class; React screens PascalCase.tsx; migrations NNNN_snake_case.sql; types PascalCase (no I-prefix); module constants UPPER_SNAKE"
  imports: "ESM with explicit .js suffix on relative imports; `import type` for types"
  errors: "AppError(ErrorCode, cause) with opaque messages; MCP via toToolErrorResult; REST via apiErrorHandler (Gate 2 failures → 404, never 403); /promote denials → opaque PERMISSION_DENIED; never swallow errors"
  config: "single zod envSchema in src/config/index.ts; booleans z.enum(['true','false']); dev bypasses/stubs guarded in superRefine (LOAD-BEARING PROD GUARD) + NODE_ENV double-check"
  data_access: "hand-written parameterized SQL; every tenant query scoped by project_id/repo_id; one write path (applyOpInTxn, insertQuarantineSnapshot) shared by promotion, review, restore and direct management"
  migrations: "additive + idempotent (IF NOT EXISTS, DO $$ … duplicate_object, guarded backfills); ALTER TYPE ADD VALUE in its own migration"
  seams: "Judge, Embedder, Authenticator, OidcVerifier, Notifier — wired once in src/index.ts; fakes implement the same interfaces"
  examples:
    - src/errors/appError.ts
    - src/judge/judge.ts
    - src/config/index.ts
    - src/db/quarantineRepository.ts
    - migrations/0003_staging.sql

# --- API surface ---
api_surface:
  - name: MCP facade
    type: internal
    path: POST /mcp (src/mcp/transport.ts); GET/DELETE → 405
    description: "recall(query, scope?, types?, limit 5..8, cursor?), get_memory(handle), get_context(), remember(op,type,title,summary,body,fields?,target_handle?), list_staged(), discard_staged(item_id); tenant from X-Git-Remote + X-Git-Branch headers; graph tools NOT implemented"
    auth: "Gate 1 Cognito bearer (dev bypass → fixed contributor principal) + Gate 2 membership; writes need project_admin|contributor|service_agent"
  - name: Governance REST
    type: REST
    path: /api/v1 (src/http/api/router.ts)
    description: >-
      GET /me; GET /projects/:id/quarantine[/:qid] (member: admin all, others own); POST …/quarantine/:qid/restore;
      GET …/review-queue[/:itemId]; POST …/review-queue/:itemId/approve|reject; GET|POST …/memories;
      POST …/memories/preview; POST …/memories/retire-by-pr; GET|PUT …/memories/:mid; POST …/memories/:mid/confirm|retire;
      GET …/admin-summary; GET …/dashboard, …/activity, …/staging (insights); GET …/search (explorer). 21 endpoints; 400/401/404/409/503 vocabulary.
    auth: "Gate 1 (dev: X-Dev-User only under AUTH_DEV_BYPASS, non-prod) + projectMember / projectAdmin"
  - name: Promotion
    type: REST
    path: POST /promote (src/http/promote.ts)
    description: "{repo, source_branch, pr_number?, merge_sha?, event merged|closed_unmerged}; merged requires token ref=refs/heads/<default>, event_name=push, job_workflow_ref=<repo>/.github/workflows/promote.yml@refs/heads/<default>; feature source needs pr_number; closed_unmerged abandons the branch session"
    auth: "GitHub OIDC (dev stub under PROMOTE_OIDC_DEV_BYPASS) + active machine_credential"
  - name: Internal jobs
    type: REST
    path: POST /internal/jobs/:job (src/jobs/jobsRouter.ts)
    description: "quarantine-purge, revalidation-sweep, web-session-reaper; same functions as pnpm job:* scripts"
    auth: "Bearer JOBS_TOKEN (>=32 chars) or open mode only when NODE_ENV=development"
  - name: Health
    type: REST
    path: GET /health
    description: "200 {status:'ok'}"
    auth: null
  - name: Web static (dev only)
    type: internal
    path: "/ (src/http/static.ts, WEB_STATIC_DIR; rejected in production)"
    description: "SPA with strict CSP; production target S3 + CloudFront"
    auth: null
  - name: CLI
    type: CLI
    path: package.json scripts
    description: "dev, build, start, test, lint, migrate, provision (PROVISION_JSON), seed:dev, smoke, demo, eval, screenshots, package:demo, job:quarantine-purge|revalidation|web-session-reaper, dev:web|build:web|typecheck:web"
    auth: null

# --- Data model (migrations 0001–0010; design source docs/artefactos/gmemo_schema_v2.sql) ---
data_model:
  tenancy: [app_user, project, repo (remote_url natural key, default_branch), project_membership, machine_credential]
  memory: "memory (status active|superseded|deprecated|pending_revalidation; provenance pr_reviewed|web_ui; origin_branch/origin_pr; revalidate_at NULL for outcome; retired_reason; approved_by; content_tsv english; embedding vector(1024) HNSW), memory_revision (immutable), memory_relation (supersedes|conflicts_with|duplicate)"
  staging: "staging_session (ULID; one open per project/repo/branch; promoted|partially_promoted|abandoned), staging_item (op, judge_state, judge_criterion, judge_confidence, mandatory_review, sanitize_flags, related_memory_id, review_* columns, promoted_at/promoted_memory_id)"
  quarantine: "quarantine (span-redacted snapshot, criterion pipeline|judge|human_review, reason_code, expires_at = +QUARANTINE_RETENTION_DAYS (60), restored_by/at/item_id)"
  audit: "access_log — every read (query_hash) and write, jobs and promote"

# --- Open decisions / known gaps ---
