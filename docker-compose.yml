services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gmemo
      POSTGRES_PASSWORD: gmemo
      POSTGRES_DB: gmemo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmemo -d gmemo"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"        # optional: host access for debugging (5433: host 5432 may be taken by a local PostgreSQL)

  # One-shot: apply numbered migrations, then the dev seed. Runs compiled JS
  # (no tsx in the image). Exits 0 on success; app waits for completion.
  migrate:
    build: .
    image: gmemo:dev
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/db/seed.js"]
    environment:
      DATABASE_URL: "postgres://gmemo:gmemo@db:5432/gmemo"   # no sslmode -> local plaintext
      NODE_ENV: development                                  # required for seed.js to proceed
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # POST /mcp requires header X-Git-Remote: https://github.com/crombie-llc/gmemo-demo.git
  # (matches the seeded repo.remote_url). RdsTenantResolver uses it for tenant resolution.
  app:
    build: .
    image: gmemo:dev
    environment:
      DATABASE_URL: "postgres://gmemo:gmemo@db:5432/gmemo"  # local, TLS not enforced (NODE_ENV!=production)
      NODE_ENV: development
      AUTH_DEV_BYPASS: "true"        # Gate-1 stub; guarded -- impossible under NODE_ENV=production
      JUDGE_STUB: "true"             # DeterministicJudge (rule-based verdicts); makes BEDROCK_MODEL_ID optional (guarded vs prod)
      PROMOTE_OIDC_DEV_BYPASS: "true" # /promote OIDC bypass; makes GITHUB_OIDC_AUDIENCE optional (guarded vs prod)
      EMBEDDER_STUB: "true"          # deterministic embedder; removes the Bedrock/AWS_REGION requirement (guarded vs prod)
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: debug
      WEB_STATIC_DIR: /app/web       # dev only — rejected under NODE_ENV=production (C2 guard); serves the web at http://localhost:3000/
      # COGNITO_* intentionally omitted -- optional under the dev bypass.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # busybox wget ships in node:alpine; 127.0.0.1 (not localhost: resolves to ::1, app listens on IPv4); hits GET /health -> 200 { status: "ok" }.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
